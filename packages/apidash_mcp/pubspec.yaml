name: apidash_mcp
description: Model Context Protocol (MCP) server for API Dash — exposes API client functionality to AI agents via stdio and HTTP/SSE transports
version: 0.1.0
homepage: https://github.com/nakisisageorge/apidash-enhanced
repository: https://github.com/nakisisageorge/apidash-enhanced
issue_tracker: https://github.com/nakisisageorge/apidash-enhanced/issues
documentation: https://github.com/nakisisageorge/apidash-enhanced/tree/main/packages/apidash_mcp
environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.2"

dependencies:
  flutter:
    sdk: flutter
  apidash_core: any
  better_networking: any
  curl_parser: any
  genai: any
  har: any
  insomnia_collection: any
  json_explorer: any
  json_field_editor: any
  multi_trigger_autocomplete_plus: any
  postman: any
  seed: any
  mcp_server: ^0.2.0
  mcp_server_http: ^0.2.0
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  grpc: ^4.0.0
  protobuf: ^3.0.0
  encrypt: ^5.0.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0
  path: ^1.8.0
  yaml: ^3.1.0
  logger: ^2.0.0
  crypto: ^3.0.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  melos: ^6.0.0
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  test: ^1.25.0
  mocktail: ^1.0.0

melos:
  command:
    exec:
      concurrency: 1
      orderDependents: true

flutter:
  uses-material-design: true